<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DocChain — Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
    body {
      background: var(--bg-color);
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    .admin-box, .admin-panel, .verify-box {
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 12px;
      padding: 1rem;
      margin: 1rem 0;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: background 0.3s, color 0.3s;
    }
    #themeToggle { margin-right: 0.5rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #ddd; text-align: left; }
    .spinner { text-align:center; padding:1rem; }
    .revoked-row { background: rgba(255, 0, 0, 0.05); }

    /* Verify Widget Styling */
    .verify-box h3 { margin-top: 0; font-size: 1.1rem; }
    .verify-box button {
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 6px;
      background: #1e93ab;
      color: white;
      cursor: pointer;
    }
    .verify-box button:hover { background: #15768a; }
    .verify-box video {
      width: 100%;
      border-radius: 8px;
      margin-top: 8px;
      display: none;
    }
    .verify-box input[type="file"] { padding: 0.3rem; }
  </style>
</head>

<body>
  <main>
    <div class="admin-wrapper">
      <section class="admin-box">
        <header class="admin-header">
          <h2>Admin Dashboard</h2>
          <button class="hamburger" id="hamburger">☰</button>

          <nav class="admin-actions nav-menu" id="navMenu">
            <div id="whoami"></div>
            <button id="themeToggle">🌙 Dark Mode</button>
            <button id="btnLogout">🚪 Logout</button>
          </nav>
        </header>

        <!-- Verify Widget -->
        <div style="margin-top:1rem;">
          <button id="openVerifyWidget">📷 Verify Letter</button>
          <div id="verifyWidgetContainer" style="display:none;margin-top:1rem;"></div>
        </div>

        <!-- Global loading spinner -->
        <div id="spinner" class="spinner hidden">⏳ Loading…</div>

        <div class="admin-grid">
          <!-- Users panel -->
          <div class="admin-panel">
            <div class="panel-head">
              <h3>Users</h3>
              <div class="panel-actions">
                <input id="userSearch" type="search" placeholder="Search email…" />
                <button id="btnSearchUsers">Search</button>
              </div>
            </div>
            <div id="usersTable">Loading users…</div>
            <div class="pagination">
              <button id="usersPrev">Prev</button>
              <span id="usersPageInfo"></span>
              <button id="usersNext">Next</button>
            </div>
          </div>

          <!-- Access logs panel -->
          <div class="admin-panel">
            <div class="panel-head">
              <h3>Access Logs</h3>
              <div class="panel-actions">
                <button id="btnExportLogs">Export CSV</button>
              </div>
            </div>
            <div id="logsTable">Loading logs…</div>
            <div class="pagination">
              <button id="logsPrev">Prev</button>
              <span id="logsPageInfo"></span>
              <button id="logsNext">Next</button>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <!-- App config & helpers -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/admin.js?v=5"></script>

  <!-- QR decoding + verify widget -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <script src="assets/js/verifyWidget.js"></script>
  <script>
    document.getElementById("openVerifyWidget").addEventListener("click", () => {
      const box = document.getElementById("verifyWidgetContainer");
      box.style.display = box.style.display === "none" ? "block" : "none";
      initVerifyWidget(box);
    });
  </script>

  <!-- Theme toggle -->
  <script>
    (() => {
      const btn = document.getElementById("themeToggle");
      const root = document.documentElement;
      if (localStorage.getItem("theme") === "light") {
        root.setAttribute("data-theme", "light");
        btn.textContent = "🌙 Dark Mode";
      }
      btn?.addEventListener("click", () => {
        if (root.getAttribute("data-theme") === "light") {
          root.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
          btn.textContent = "☀️ Light Mode";
        } else {
          root.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          btn.textContent = "🌙 Dark Mode";
        }
      });
    })();
  </script>

  <!-- Hamburger -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const burger = document.getElementById("hamburger");
      const menu = document.getElementById("navMenu");
      if (burger && menu)
        burger.addEventListener("click", () => menu.classList.toggle("active"));
    });
  </script>
</body>
</html>
