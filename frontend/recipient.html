<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DocChain — Recipient Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/css/styles.css" />

  <style>
  /* ================= Modal Styling (Theme-Aware Popup) ================= */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    justify-content: center;
    align-items: center;
  }
  .modal:not(.hidden) { display: flex; }

  .modal-content.large {
    background: var(--color-panel);    /* matches blue/white panel color */
    color: var(--color-text);          /* adapts to theme text color */
    padding: 20px;
    border-radius: 12px;
    max-width: 800px;
    width: 90%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    animation: popIn 0.2s ease-out;
    position: relative;
    border: 1px solid var(--color-border);
  }

  .close {
    float: right;
    font-size: 20px;
    cursor: pointer;
    color: var(--color-heading);
  }
  .close:hover { color: var(--color-accent); }

  #previewText {
    white-space: pre-wrap;
    font-family: monospace;
    margin-top: 1rem;
    color: var(--color-text);
  }

  /* Spinner */
  .spinner {
    border: 4px solid var(--color-border);
    border-top: 4px solid var(--color-accent);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 0.8s linear infinite;
    margin: 2rem auto;
  }

  .hidden { display: none; }
  @keyframes spin { 0%{transform:rotate(0deg);}100%{transform:rotate(360deg);} }
  @keyframes popIn { from{transform:scale(0.9);opacity:0;}to{transform:scale(1);opacity:1;} }

  /* Filters */
  .filters {
    margin: 1rem 0;
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .filters input, .filters select, .filters button {
    padding: 0.4rem 0.6rem;
    font-size: 0.9rem;
    border: 1px solid var(--color-border);
    border-radius: 6px;
    background: var(--color-panel);
    color: var(--color-text);
  }

  /* Panels & Layout */
  body {
    background: var(--color-bg);
    color: var(--color-text);
    transition: background 0.3s, color 0.3s;
  }
  .recipient-box, .letters-panel, .verify-box {
    background: var(--color-panel);
    color: var(--color-text);
    border-radius: 12px;
    padding: 1rem;
    margin: 1rem 0;
    box-shadow: 0 2px 6px var(--shadow-color);
    transition: background 0.3s, color 0.3s;
  }

  /* ================================
     Letters Table (Theme-Consistent)
     ================================ */
  .letters-panel table {
    width: 100%;
    border-collapse: collapse;
    min-width: 800px;
    background: var(--color-panel);
    color: var(--color-text);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 1rem;
    box-shadow: 0 2px 6px var(--shadow-color);
  }

  .letters-panel th,
  .letters-panel td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--color-border);
    text-align: left;
    color: var(--color-text);
  }

  .letters-panel th {
    font-weight: 600;
    color: var(--color-heading);
    background: var(--color-bg);
  }

  .letters-panel tr:hover {
    background: rgba(0,0,0,0.04);
  }

  [data-theme="dark"] .letters-panel tr:hover {
    background: rgba(255,255,255,0.06);
  }

  /* Badges + Buttons Consistent */
  .badge.active  { background: var(--color-primary); color: #fff; }
  .badge.revoked { background: var(--color-error); color: #fff; }
  .badge.expired { background: var(--color-warning); color: #fff; }

  .letters-panel button {
    background: var(--color-primary);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 0.4rem 0.8rem;
    cursor: pointer;
    font-weight: 500;
    transition: background-color 0.2s ease;
  }
  .letters-panel button:hover {
    background: var(--color-accent);
  }

  /* Verify Widget */
  .verify-box h3 { margin-top:0; font-size:1.1rem; color: var(--color-heading); }
  .verify-box button {
    padding:0.4rem 0.8rem;
    border:none;
    border-radius:6px;
    background: var(--color-primary);
    color:#fff;
    cursor:pointer;
  }
  .verify-box button:hover { background: var(--color-accent); }
  .verify-box video {
    width:100%; border-radius:8px; margin-top:8px; display:none;
  }
  .verify-box input[type="file"] {
    padding:0.3rem;
    border:1px solid var(--color-border);
    background: var(--color-panel);
    color: var(--color-text);
  }

  #themeToggle { margin-right:0.5rem; cursor:pointer; }
  </style>
</head>

<body>
  <main>
    <div class="recipient-wrapper">
      <section class="recipient-box">
        <header class="recipient-header">
          <h2>Recipient Dashboard</h2>

          <!-- Hamburger -->
          <button class="hamburger" id="hamburger">☰</button>

          <!-- Navigation -->
          <nav class="recipient-actions nav-menu" id="navMenu">
            <div id="whoami"></div>
            <button id="themeToggle">Dark Mode</button>
            <button id="btnLogout">Logout</button>
          </nav>
        </header>

        <!-- Verify Widget -->
        <div style="margin-top:1rem;">
          <button id="openVerifyWidget">Verify Letter</button>
          <div id="verifyWidgetContainer" style="display:none;margin-top:1rem;"></div>
        </div>

        <div class="letters-panel">
          <h3>Your Letters</h3>

          <!-- Filters -->
          <div class="filters">
            <input id="searchBox" type="text" placeholder="Search by ID or file name" />
            <select id="statusFilter">
              <option value="">All</option>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
              <option value="revoked">Revoked</option>
            </select>
            <button id="btnSearch">Search</button>
            <button id="btnReset">Reset</button>
          </div>

          <button id="btnDownloadAll">Download All Letters</button>
          <div id="lettersTable">Loading…</div>
        </div>
      </section>
    </div>
  </main>

  <!-- Preview Modal -->
  <div id="previewModal" class="modal hidden">
    <div class="modal-content large">
      <span id="closePreview" class="close">&times;</span>
      <h3>Letter Preview</h3>
      <div id="spinner" class="spinner hidden"></div>
      <pre id="previewText"></pre>
    </div>
  </div>

  <!-- JS Includes -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/recipient.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
  <script src="assets/js/verifyWidget.js"></script>

  <!-- Verify Widget Toggle -->
  <script>
    document.getElementById("openVerifyWidget").addEventListener("click", () => {
      const box = document.getElementById("verifyWidgetContainer");
      box.style.display = box.style.display === "none" ? "block" : "none";
      initVerifyWidget(box);
    });
  </script>

  <!-- Theme Toggle -->
  <script>
    (() => {
      const btn = document.getElementById("themeToggle");
      const root = document.documentElement;
      if (localStorage.getItem("theme") === "light") {
        root.setAttribute("data-theme", "light");
        btn.textContent = "Dark Mode";
      }
      btn?.addEventListener("click", () => {
        if (root.getAttribute("data-theme") === "light") {
          root.removeAttribute("data-theme");
          localStorage.setItem("theme", "dark");
          btn.textContent = "Light Mode";
        } else {
          root.setAttribute("data-theme", "light");
          localStorage.setItem("theme", "light");
          btn.textContent = "Dark Mode";
        }
      });
    })();
  </script>

  <!-- Hamburger Menu -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const burger = document.getElementById("hamburger");
      const menu = document.getElementById("navMenu");
      if (burger && menu)
        burger.addEventListener("click", () => menu.classList.toggle("active"));
    });
  </script>
</body>
</html>
